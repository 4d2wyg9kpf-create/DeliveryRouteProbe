name: Build unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DeliveryRouteProbe.swiftpm/**'
      - 'DeliveryRouteProbe.xcodeproj/**'
      - 'native/**'
      - 'scripts/build_ios.sh'
      - 'scripts/select_xcode.py'
      - 'scripts/test_housing_kakao.*'
      - 'scripts/package_unsigned_ipa.py'
      - 'scripts/test_facility_routes.*'
      - 'scripts/test_facility_live.*'
      - 'scripts/facility_route*'
      - 'tests/facility_route_tests.js'
      - 'scripts/test_naver_frames.*'
      - 'scripts/test_naver_api.*'
      - 'scripts/test_shared_links.*'
      - 'scripts/test_departure_time.*'
      - 'scripts/test_api_persistence.*'
      - 'scripts/test_device_sharing.*'
      - 'scripts/test_public_data.*'
      - 'scripts/test_public_data_live_clock.*'
      - 'scripts/test_place_destinations.*'
      - 'scripts/test_evaluation_reference.*'
      - 'scripts/test_building_evaluation.*'
      - 'tests/naver_api_tests.js'
      - 'tests/shared_pin_tests.js'
      - 'tests/delivery_flow_tests.js'
      - 'scripts/naver_frame_fixtures.py'
      - 'scripts/naver_fixture_info.plist'
      - '.github/workflows/build-ipa.yml'

permissions:
  contents: read

concurrency:
  group: delivery-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naver-checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify housing parsing, editable coordinates, source preservation and Kakao routing request gates
        run: bash scripts/test_housing_kakao.sh
      - name: Verify individual buildings, entrance gates, source priority and Kapt reference addresses
        run: bash scripts/test_building_evaluation.sh
      - name: Verify frozen reference distributions, stable scores, hierarchy, versions and shared persistence
        run: bash scripts/test_evaluation_reference.sh
      - name: Verify one public apartment using the paced production URLSession client
        # External reachability is recorded separately from deterministic checks.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set -o pipefail
          build/housing-kakao-tests --realty-live 2>&1 | tee build/logs/realty-live.log
      - name: Verify cross-origin iframe reads and share links in native WKWebView
        run: bash scripts/test_naver_frames.sh
      - name: Verify mobile and desktop route identities and units
        run: node tests/facility_route_tests.js
      - name: Verify route summaries at phone widths and desktop cropped canvas in native WKWebView
        run: bash scripts/test_facility_routes.sh
      - name: Verify official API parsing and free quota boundary cases
        run: node tests/naver_api_tests.js
      - name: Verify shared pin coordinates cannot be replaced by building geocoding
        run: node tests/shared_pin_tests.js
      - name: Verify browserless HTTP shared pin reading and bounded redirect handling
        run: bash scripts/test_shared_links.sh
      - name: Verify current departure time, midnight rollover and Korean API time
        run: bash scripts/test_departure_time.sh
      - name: Verify nine selected deliveries optimize without manually registered travel legs
        run: node tests/delivery_flow_tests.js
      - name: Verify persisted native request gates with mocked API transport
        run: bash scripts/test_naver_api.sh
      - name: Verify API keys and quota ledgers survive updates and Keychain access changes
        run: bash scripts/test_api_persistence.sh
      - name: Verify shared folder merge, deletion, credential preservation and cross-device usage accounting
        run: bash scripts/test_device_sharing.sh
      - name: Verify public business radius, license dates, pagination, persistence and request gates
        run: bash scripts/test_public_data.sh
      - name: Verify shipped URLSession reads a live HTTPS clock without an API key or data quota use
        run: bash scripts/test_public_data_live_clock.sh
      - name: Verify selected place destinations, bulk import, deduplication and deletion persist independently
        run: bash scripts/test_place_destinations.sh
      - name: Verify live mobile walk/transit and scheduled desktop car routes on both providers
        env:
          TZ: Asia/Seoul
        run: bash scripts/test_facility_live.sh
      - name: Upload native check log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DeliveryRouteProbe-native-check-log
          path: |
            build/logs/*.log
            build/logs/facility-live.json
          if-no-files-found: ignore
          retention-days: 7
  ipa:
    needs: naver-checks
    # Standard Apple Silicon runner; no paid large-runner label.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select stable Xcode with iOS 26 background task support
        run: python3 scripts/select_xcode.py
      - name: Build device app and package unsigned IPA
        run: bash scripts/build_ios.sh unsigned
      - name: Upload IPA and its verification report
        uses: actions/upload-artifact@v7
        with:
          name: DeliveryRouteProbe-unsigned-ipa
          path: |
            build/ipa/*.ipa
            build/ipa/*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DeliveryRouteProbe-build-log
          path: build/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
