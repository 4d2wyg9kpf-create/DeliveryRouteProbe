	//차트 생성  기존 HighChart -> 변경 ChartJs 
	function makeChart(pArrCategory, pArrData){
		
		var m_yLabels = [];
	
		for(var i=0; i<pArrData.length; i++){		
				m_yLabels.push(pArrData[i]);
		}
		
		//$('#myChart').css({width:'400px', height:pArrData.length*20+"px"});
		
		m_yLabels.sort(function(a,b){
				return Number(utilMng.replaceAll(b,",",""))-Number(utilMng.replaceAll(a,",",""))
		});
		//console.log(m_yLabels);
		
		
		if(myChart != undefined){
			myChart.destroy();
		}  
		
		var context = document.getElementById('myChart').getContext('2d');
		myChart = new Chart(context,{
			type:'line',
			data:{
				labels : pArrCategory,				
				yLabels: m_yLabels,
				datasets : [{
					label : '공시가격 추이(단위:원)',
					/* lineTension : 0, */
					data : pArrData,
					borderColor:'#f7473e',
					backgroundColor : 'rgba(255,99,132,0.2)'
				}]
			},
			options: {				
				responsive: false,				
				tooltips: {
					mode: 'index',
					intersect: false,
					position: 'nearest'
				},
				hover: {
					mode: 'nearest',
					intersect: true
				},
				scales: {
					xAxes: [{
						display: true
/* 						scaleLabel: {
							display: true,
							labelString: '년도'
						} */
					}], 
					yAxes: [{
						type: 'category', 						
						position: 'left',
						display: true						
					}]
				}
			}
			
		});
		
	}
	
	
	function chgPriceChart(yearGbn){
			
		$("#chartGbn li a").removeClass("selected").eq(yearGbn-1).addClass("selected");
		
		var param = {};
		var arrCategory = [];	//차트용 카테고리 array
		var arrPrice = new Array();		//차트용 데이터 array
		var frm = document.forms['apt_form'];
		
		param.notice_date  = frm.notice_date.value;
		param.gbn   = yearGbn;   // 1:5년 , 2:10년 , 3:전체
		param.apt_code  = frm.apt_code.value;
		param.dong_code  = frm.dong_code.value;
		param.ho_code  = frm.ho_code.value;
		
		
		ajaxMng.run(contextPath + "/m/town/chgPriceChart.do", param , function(data){
		
			for(var i=data.length-1; i>=0; i--){	//차트 데이터 넣기(asc)	
				//차트 데이터 넣기					
				arrCategory.push(data[i].NOTICE_DATE_NAME.substr(0,4));		
				//arrPrice.push(Number(utilMng.replaceAll(data[i].NOTICE_AMT,',','')));
				arrPrice.push(data[i].NOTICE_AMT);
			} 
			
			makeChart(arrCategory, arrPrice);	//차트 생성					
			
		});
		
	}
